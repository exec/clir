[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyclir"
version = "0.2.2"
description = "A modern CLI toolkit for building beautiful terminal applications"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dylan Hart", email = "execxd@icloud.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "rich>=13.0.0,<16.0.0",
    "pydantic>=2.0.0,<4.0.0",
    "prompt_toolkit>=3.0.0,<5.0.0",
]

[project.optional-dependencies]
# clir.config imports yaml / tomli / tomli_w behind try-except guards, so they
# stay optional — but they have to be declarable, or `pip install pyclir` gives
# you a config module that can only ever read JSON.
config = [
    "pyyaml>=6.0",
    # clir.config imports `tomli` by name on every Python version (it does not
    # fall back to the 3.11+ stdlib tomllib), so this is not version-gated.
    "tomli>=2.0.0",
    "tomli_w>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "pyclir[config]",
]

[project.scripts]
clir = "clir:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clir*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
