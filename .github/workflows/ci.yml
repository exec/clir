name: CI

# Runs the Python test suite and the linter on every push and pull request.
# The other workflows only build the site / publish releases, so this is the
# only place `pytest` and `ruff` actually run.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,config]"

      - name: Run pytest
        run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # Advisory for now: the tree has ~215 pre-existing style violations
      # (unsorted imports, unused imports, deprecated typing imports). Cleaning
      # those up is a separate, diff-heavy PR; flip continue-on-error off once
      # it lands so lint becomes a real gate.
      - name: Run ruff
        continue-on-error: true
        run: ruff check .
